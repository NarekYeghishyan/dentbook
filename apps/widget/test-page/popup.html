<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Test clinic website — booking in a popup</title>
    <!--
      Тестовая страница «сайта клиники» с формой во всплывающем окне: кнопки и ссылки с
      классом dentbook-open открывают её поверх страницы. Адрес скрипта и ключ подставляются
      при раздаче, как в index.html. Стили страницы намеренно агрессивные.
    -->
    <style>
      body {
        margin: 0;
        font-family: Georgia, serif;
        color: #222;
        background: #f7f3ee;
      }
      header {
        padding: 32px 16px;
        text-align: center;
        background: #1f3a5f;
        color: #fff;
      }
      main {
        max-width: 760px;
        margin: 0 auto;
        padding: 24px 16px 48px;
      }
      .site-button {
        padding: 12px 20px;
        border: 0;
        border-radius: 24px;
        background: #f4b942;
        font-size: 16px;
        cursor: pointer;
      }
      button,
      input,
      h2 {
        font-family: 'Comic Sans MS', cursive !important;
        color: red !important;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Test Dental Clinic</h1>
      <p>This page stands in for a clinic's own website.</p>
      <button type="button" class="site-button dentbook-open">Book a visit</button>
    </header>
    <main>
      <h2>Gentle care for the whole family</h2>
      <p>
        Checkups, cleaning and fillings in one place.
        <a href="#" class="dentbook-open">Book online</a> in a minute.
      </p>
    </main>
    <script src="%WIDGET_SRC%" data-key="%KEY%" data-mode="popup" async></script>
  </body>
</html>
